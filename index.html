<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis IPA IX - Tantangan Rimba Acak</title>
    <style>
        :root {
            --leaf-green: #2ecc71;
            --dark-forest: #1b5e20;
            --dirt-brown: #795548;
            --bush-green: #27ae60;
            --white: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .decoration {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 100px;
            z-index: -1;
            pointer-events: none;
        }

        .bush {
            position: absolute;
            bottom: -10px;
            font-size: 80px;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.2));
        }

        #quiz-container {
            background: var(--white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 30px;
            border: 5px solid var(--dark-forest);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        .header h1 {
            color: var(--dark-forest);
            text-align: center;
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
        }

        .info {
            text-align: center;
            color: var(--dirt-brown);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .q-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.4;
            padding: 15px;
            background: #f1f8e9;
            border-radius: 15px;
            border-left: 8px solid var(--bush-green);
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .opt {
            padding: 15px 20px;
            border: 2px solid #c8e6c9;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            font-weight: 500;
            color: #333;
            text-align: left;
        }

        .opt:hover:not(:disabled) {
            transform: translateY(-3px);
            background: #f0fff4;
            border-color: var(--leaf-green);
        }

        .opt.correct-flash {
            background: linear-gradient(to right, #2ecc71, #27ae60) !important;
            color: white !important;
            border: none;
        }

        .opt.wrong-flash {
            background: linear-gradient(to right, #e74c3c, #c0392b) !important;
            color: white !important;
            border: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        #prev-btn { background: #95a5a6; }
        #reset-btn { background: var(--dirt-brown); }
        #next-btn { background: var(--dark-forest); }

        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #result-screen { text-align: center; display: none; }
        .score-box { font-size: 4rem; color: var(--dark-forest); font-weight: 900; }
    </style>
</head>
<body>

<div class="decoration">
    <span class="bush" style="left: 5%">🌳</span>
    <span class="bush" style="left: 30%">🌲</span>
    <span class="bush" style="right: 10%">🌱</span>
</div>

<div id="quiz-container">
    <div id="quiz-screen">
        <div class="header">
            <h1>🌲 Kuis IPA Rimba 🌲</h1>
            <div class="info" id="progress">Mempersiapkan rute...</div>
        </div>
        <div class="question-box">
            <div class="q-text" id="q-text">Mencari soal di dalam hutan...</div>
            <div id="feedback-msg" style="font-weight: bold; margin-bottom: 10px; min-height: 20px; text-align: center;"></div>
            <div class="options-grid" id="options"></div>
        </div>
        <div class="nav-bar">
            <button class="btn" id="prev-btn" onclick="move(-1)">Kembali</button>
            <button class="btn" id="reset-btn" onclick="shuffleAndRestart()">Acak & Ulang</button>
            <button class="btn" id="next-btn" onclick="move(1)">Lanjut</button>
        </div>
    </div>

    <div id="result-screen">
        <h1>🐾 Penjelajahan Selesai!</h1>
        <div class="score-box" id="score-out">0</div>
        <p id="summary"></p>
        <button class="btn" style="background: var(--dark-forest); width: 100%;" onclick="shuffleAndRestart()">Mulai Petualangan Baru</button>
    </div>
</div>

<script>
    // Data soal dengan posisi jawaban benar (c) yang sudah disebar acak
    const originalQuizData = [
        { q: "Penyakit perut yang disebabkan oleh air tercemar bakteri Vibrio cholerae adalah...", a: ["Tipus", "Disentri", "Diare", "Kolera"], c: 3 },
        { q: "Ciri air yang tercemar akibat pertambangan ilegal biasanya mengandung logam berat bersifat...", a: ["Toksik/racun", "Jernih alami", "Kaya oksigen", "Banyak ikan"], c: 0 },
        { q: "Mengapa pemilahan sampah organik dan anorganik sangat penting?", a: ["Menambah volume sampah", "Memudahkan proses daur ulang", "Mempercepat plastik hancur", "Agar sampah bau"], c: 1 },
        { q: "Menggunakan kembali botol bekas menjadi tempat pensil merupakan penerapan prinsip...", a: ["Reduce", "Recycle", "Reuse", "Replace"], c: 2 },
        { q: "Dampak pengelolaan sampah yang buruk terhadap lingkungan adalah...", a: ["Pemandangan asri", "Tanah jadi subur", "Banjir dan polusi", "Udara bersih"], c: 2 },
        { q: "Gas utama yang menyebabkan terjadinya pemanasan global adalah...", a: ["Nitrogen", "Karbon Dioksida (CO2)", "Oksigen", "Argon"], c: 1 },
        { q: "Dampak pemanasan global bagi kutub bumi adalah...", a: ["Habitat meluas", "Suhu mendingin", "Es menebal", "Es mencair"], c: 3 },
        { q: "Efek rumah kaca terjadi karena...", a: ["Panas terperangkap gas atmosfer", "Hutan terlalu lebat", "Rumah kaca terlalu banyak", "Matahari meredup"], c: 0 },
        { q: "Tindakan yang dapat mengurangi dampak pemanasan global adalah...", a: ["Membakar hutan", "Menanam pohon", "Pakai AC non-stop", "Pakai motor terus"], c: 1 },
        { q: "Sumber emisi karbon dioksida terbesar di atmosfer berasal dari...", a: ["Fotosintesis", "Uap air", "Pembakaran fosil", "Pernapasan ikan"], c: 2 },
        { q: "Upaya meningkatkan ketahanan pangan melalui bibit unggul disebut...", a: ["Intensifikasi", "Ekstensifikasi", "Diversifikasi", "Rehabilitasi"], c: 0 },
        { q: "Perubahan iklim dapat menurunkan ketahanan pangan karena...", a: ["Tanah subur", "Gagal panen/cuaca ekstrem", "Pupuk murah", "Hama punah"], c: 1 },
        { q: "Faktor yang dapat mengancam ketersediaan pangan nasional adalah...", a: ["Alih fungsi lahan tani", "Hujan teratur", "Teknologi modern", "Pupuk organik"], c: 0 },
        { q: "Salah satu penyebab terjadinya krisis energi adalah...", a: ["Hemat listrik", "Pakai sepeda", "Konsumsi fosil berlebih", "Surya melimpah"], c: 2 },
        { q: "Manfaat penggunaan energi alternatif (panel surya) adalah...", a: ["Polusi tinggi", "Biaya murah selamanya", "Ramah lingkungan", "Susah dicari"], c: 2 },
        { q: "Bioteknologi konvensional memanfaatkan...", a: ["Mikroorganisme utuh", "Rekayasa DNA", "Kloning", "Peralatan robotik"], c: 0 },
        { q: "Pasangan produk dan mikroorganisme bioteknologi yang benar adalah...", a: ["Tempe - Virus", "Keju - Bakteri", "Roti - Alga", "Yogurt - Jamur"], c: 1 },
        { q: "Jamur Saccharomyces cerevisiae pada roti berfungsi untuk...", a: ["Membuat asam", "Membunuh bakteri", "Menambah protein", "Menghasilkan CO2"], c: 3 },
        { q: "Perbedaan utama bioteknologi konvensional dan modern adalah...", a: ["Lokasi pabrik", "Warna produk", "Rekayasa genetika", "Harga bahan"], c: 2 },
        { q: "Contoh penerapan bioteknologi modern adalah...", a: ["Pembuatan tapai", "Kecap manis", "DNA rekombinan", "Oncom merah"], c: 2 },
        { q: "Penerapan bioteknologi dalam medis contohnya penggunaan insulin untuk...", a: ["Penyakit kulit", "Diabetes", "Penyakit asma", "Penyakit flu"], c: 1 },
        { q: "Manfaat bioteknologi bagi manusia di bidang pangan adalah...", a: ["Menurunkan gizi", "Menciptakan bibit unggul", "Mempercepat busuk", "Pestisida naik"], c: 1 },
        { q: "Dampak negatif bioteknologi bagi ekosistem adalah...", a: ["Tanah subur", "Udara bersih", "Hilangnya plasma nutfah", "Hama punah"], c: 2 },
        { q: "Bagian sel yang berfungsi sebagai unit pembawa informasi genetik adalah...", a: ["Gen", "Ribosom", "Vakuola", "Dinding sel"], c: 0 },
        { q: "Fungsi kromosom dalam pewarisan sifat adalah...", a: ["Sintesis protein", "Membawa kode DNA", "Mengatur air", "Mencerna gula"], c: 1 },
        { q: "Hubungan antara DNA, gen, dan kromosom yang benar adalah...", a: ["Gen di dalam kromosom", "Kromosom di dalam gen", "DNA tidak ada gen", "Gen lebih besar"], c: 0 },
        { q: "Sifat yang tetap muncul meskipun berpasangan dengan sifat berbeda disebut...", a: ["Resesif", "Intermediet", "Hibrid", "Dominan"], c: 3 },
        { q: "Hasil persilangan monohibrid dominan penuh (Mm x Mm) rasio genotipenya...", a: ["3:1", "1:2:1", "1:1", "9:3:3:1"], c: 1 },
        { q: "Pewarisan sifat pada makhluk hidup bertujuan untuk...", a: ["Populasi turun", "Ciri induk hilang", "Menjaga kelestarian jenis", "Mempercepat mati"], c: 2 },
        { q: "Contoh pewarisan sifat yang nampak langsung pada manusia adalah...", a: ["Hobi", "IQ", "Pakaian", "Warna kulit"], c: 3 },
        { q: "Ciri terjadinya reaksi kimia pada pembakaran kertas adalah...", a: ["Kertas basah", "Warna tetap", "Terbentuk abu", "Bentuk utuh"], c: 2 },
        { q: "Contoh reaksi kimia dalam kehidupan yang merugikan adalah...", a: ["Besi berkarat", "Buat tempe", "Masak nasi", "Fotosintesis"], c: 0 },
        { q: "Perubahan warna pada buah apel yang dikupas menunjukkan reaksi...", a: ["Penguapan", "Oksidasi", "Pembekuan", "Penyubliman"], c: 1 },
        { q: "Gas yang terbentuk saat cuka dicampur dengan baking soda adalah...", a: ["Nitrogen", "Oksigen", "Karbon dioksida", "Hidrogen"], c: 2 },
        { q: "Terbentuknya endapan putih saat mencampurkan larutan kimia menunjukkan...", a: ["Reaksi kimia", "Perubahan fisik", "Penguapan", "Pencairan"], c: 0 },
        { q: "Reaksi kimia yang ditandai dengan penurunan suhu lingkungan disebut...", a: ["Eksoterm", "Isoterm", "Hipoterm", "Endoterm"], c: 3 },
        { q: "Reaksi pembakaran kayu merupakan contoh reaksi...", a: ["Oksidasi", "Reduksi", "Sublimasi", "Penguapan"], c: 0 },
        { q: "Salah satu contoh reaksi oksidasi di dalam tubuh adalah...", a: ["Gerak kaki", "Respirasi seluler", "Dengar suara", "Penyaringan air"], c: 1 },
        { q: "Proses korosi pada logam besi dapat dihambat dengan cara...", a: ["Air garam", "Lembap", "Pengecatan", "Amplas terus"], c: 2 },
        { q: "Manfaat reaksi kimia fotosintesis bagi makhluk hidup adalah menghasilkan...", a: ["Karbohidrat & O2", "CO2 & Panas", "Racun", "Limbah"], c: 0 }
    ];

    let currentQuizData = [];
    let current = 0;
    let userAnswers = [];

    function shuffleData(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function shuffleAndRestart() {
        currentQuizData = shuffleData([...originalQuizData]);
        current = 0;
        userAnswers = new Array(currentQuizData.length).fill(null);
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        render();
    }

    function render() {
        const data = currentQuizData[current];
        document.getElementById('progress').innerText = `Jalur ${current + 1} dari ${currentQuizData.length}`;
        document.getElementById('q-text').innerText = data.q;
        const fbMsg = document.getElementById('feedback-msg');
        fbMsg.innerText = "";
        
        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';
        
        data.a.forEach((text, i) => {
            const btn = document.createElement('button');
            btn.className = `opt`;
            btn.innerText = `${String.fromCharCode(65+i)}. ${text}`;
            
            if (userAnswers[current] !== null) {
                btn.disabled = true;
                if (i === data.c) {
                    btn.classList.add('correct-flash');
                } else if (i === userAnswers[current]) {
                    btn.classList.add('wrong-flash');
                }
                
                if (userAnswers[current] === data.c) {
                    fbMsg.innerText = "🍃 Mantap! Benar.";
                    fbMsg.style.color = "var(--dark-forest)";
                } else {
                    fbMsg.innerText = "🍂 Waduh, salah rute...";
                    fbMsg.style.color = "var(--dirt-brown)";
                }
            }
            btn.onclick = () => handleSelect(i);
            optContainer.appendChild(btn);
        });

        document.getElementById('prev-btn').disabled = current === 0;
        document.getElementById('next-btn').innerText = current === currentQuizData.length - 1 ? "Hasil Akhir" : "Lanjut";
    }

    function handleSelect(index) {
        userAnswers[current] = index;
        render();
    }

    function move(step) {
        if (step === 1 && userAnswers[current] === null) {
            alert("Pilih jawaban dulu!");
            return;
        }
        current += step;
        if (current >= currentQuizData.length) {
            finish();
        } else {
            render();
        }
    }

    function finish() {
        document.getElementById('quiz-screen').style.display = 'none';
        const result = document.getElementById('result-screen');
        result.style.display = 'block';

        let scoreCount = 0;
        userAnswers.forEach((ans, i) => { if(ans === currentQuizData[i].c) scoreCount++; });
        
        const finalScore = Math.round((scoreCount / currentQuizData.length) * 100);
        document.getElementById('score-out').innerText = finalScore;
        
        let msg = finalScore >= 80 ? "AI NIH" : "GOBLOK LU YA";
        document.getElementById('summary').innerText = `Skor: ${finalScore}. ${msg} (${scoreCount}/${currentQuizData.length})`;
    }

    shuffleAndRestart();
</script>
</body>
</html>
